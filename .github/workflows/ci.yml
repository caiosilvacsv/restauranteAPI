name: Java CI with Maven

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes Automatizados com Maven
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/restaurant
          DATASOURCE_USERNAME: postgres
          DATASOURCE_PASSWORD: password
          JWT_SECRET: ci_test_super_secret_jwt_key_restaurant_2026
          JWT_ISSUER: restaurant-api
          DB_MAX_POOL_SIZE: 10
          DB_MIN_IDLE: 2
        run: mvn clean test -B
