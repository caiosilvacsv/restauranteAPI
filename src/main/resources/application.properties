spring.application.name=api

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/restaurant}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:password}

# Pool de Conexões HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=RestaurantHikariCP

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enable=true
spring.flyway.locations=classpath:db/migration

api.security.secret.key=${JWT_SECRET:mysecret-key}
api.security.secret.issuer=${JWT_ISSUER:restaurant-api}
spring.threads.virtual.enabled=true
payment.api.url=${PAYMENT_URL:https://api.sumup.com/v0.1}

sumup.api.key=${PAYMENT_KEY:sup_sk_dummy_key}
api.security.merchant.code=${MERCHANT_CODE:M1234567}

# List of trusted sources (comma-separated)
app.security.allowed-origins=${SECURITY_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:8080}
# Default security URL if the request arrives without the Origin header
app.frontend.default-url=${FRONT_DEFAULT_URL:http://localhost:3000}

